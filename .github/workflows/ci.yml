# CI — گیتِ هر بیلد/PR پروژهٔ ترازین
#
# یک job واحد («checks») که کل گیت را در خود دارد:
#   1) tools/run-checks.sh — اسکن cross-schema، گاردهای قالب چاپ، کل سویت تست،
#      بیلد وب، گارد stale. وقتی SQL Server در دسترس باشد (سرویس پایین) تست‌های
#      DBدار همین‌جا واقعاً اجرا می‌شوند؛ در غیر این صورت Skip می‌شوند نه Fail.
#   2) step شرطی DB — با سرویس SQL Server 2022: اگر SQL در دسترس بود، اسکیمای
#      واقعی از روی Tarazin.Data/Scripts/*/_Ensure.sql ساخته می‌شود و گاردهای
#      DBدار (قالب چاپ + بستن سال) مقابل همان اسکیما اجرا می‌شوند.
#      اگر SQL در دسترس نبود، این گام‌ها Skip می‌شوند و گیت همچنان سبز می‌ماند
#      (مثل رفتار محلی «Skip نه Fail»).
#
# راه‌اندازی محلی معادل:  bash tools/run-checks.sh

name: CI

# CI روی شاخهٔ پیش‌فرض (main/stable) و شاخهٔ در حال توسعه (develop) اجرا
# می‌شود. badge جداگانهٔ main و develop در README هرکدام وضعیت همان شاخه را
# نشان می‌دهند. شاخه‌های موقت (arena/* و …) هم CI می‌گیرند ولی badge ندارند.
on:
  push:
  pull_request:

jobs:
  checks:
    name: Checks (scan + tests + build + stale guard + DB guards)
    runs-on: ubuntu-latest
    env:
      # کانتینر SQL Server رمز ضعیف را نمی‌پذیرد (سیاست رمز قوی) — و تست‌ها
      # اتصال را از TARAZIN_TEST_CONN می‌خوانند (پیش‌فرض محلی 123456 است).
      SQL_PASSWORD: "Tarazin#CI2026!"
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Tarazin#CI2026!"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Tarazin#CI2026!' -C -b -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # pymupdf برای گارد هدر راست‌چین (step 3b در run-checks.sh) لازم است:
      # بدون آن، tools/check-rtl-headers.sh SKIP می‌شود نه Fail می‌شود. با
      # نصب‌کردنش این‌جا، آن گام واقعاً اجرا و لوگوی هدر راست‌ترین (RTL) را
      # روی خروجیِ PDF های برون‌ریزی‌شده (فاکتور/چک/جدول/قالب) در CI تأیید می‌کند.
      - name: Setup Python + pymupdf (RTL header check)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pymupdf
        run: python -m pip install --upgrade pip pymupdf

      # آمادگی SQL را می‌سنجد ولی job را fail نمی‌کند — خروجی ready برای
      # گام‌های شرطی DB استفاده می‌شود (SQL نبود → Skip، مثل محلی).
      - name: Wait for SQL Server (optional — DB steps skip if unavailable)
        id: wait-sql
        run: |
          CID="${{ job.services.sqlserver.id }}"
          READY="false"
          for i in $(seq 1 30); do
            if docker exec "$CID" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q 'SELECT 1' >/dev/null 2>&1; then
              echo "SQL Server ready"
              READY="true"
              break
            fi
            echo "waiting for SQL Server ($i)..."
            sleep 5
          done
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          if [ "$READY" != "true" ]; then
            echo "⚠ SQL Server NOT available — DB-backed guards will Skip (mirrors local Skip-not-Fail)"
          fi

      # گیت اصلی — با TARAZIN_TEST_CONN، تست‌های DBدار همین‌جا واقعاً اجرا
      # می‌شوند وقتی سرویس SQL آماده است؛ وگرنه Skip (خود run-checks.sh).
      - name: Run full check gate
        env:
          TARAZIN_TEST_CONN: "Server=localhost;Database=TarazinMaster;User Id=sa;Password=Tarazin#CI2026!;TrustServerCertificate=True;Encrypt=False"
        run: bash tools/run-checks.sh

      # ══ گارد A5L قالب چاپ — صریح و جدا ══
      # همان گام «۴ج» run-checks.sh که این‌جا به‌صورت یک step نام‌دار اجرا می‌شود
      # تا در لیست job دیده شود: خروجی BuildTemplatePdf با override «A5L» باید
      # MediaBox افقی ≈ ۵۹۵×۴۲۰ (نه پرتره و نه A4) و هدر RTL (لوگو راست‌ترین) داشته
      # باشد. به فایل‌های dump تولیدشدهٔ step «Run full check gate» و pymupdf
      # نصب‌شدهٔ بالا وابسته است؛ بدون آن‌ها SKIP می‌شود نه Fail.
      - name: Run A5L template guard (pymupdf — MediaBox + RTL header)
        run: bash tools/check-rtl-headers.sh a5l

      # ══ step شرطی DB (ادغامِ job سابق db-guards) ══
      # اسکیمای واقعی از روی _Ensure های منبع (idempotent) — معادل init هاست
      - name: Initialize schemas from source (_Ensure, idempotent)
        if: steps.wait-sql.outputs.ready == 'true'
        run: |
          set -euo pipefail
          CID="${{ job.services.sqlserver.id }}"
          # ترتیب مثل EnsureSchemaAsync هاست: central اول (Companies/FiscalYears)
          # چون بقیهٔ اسکیماها به آن FK دارند؛ بعد بقیه به‌ترتیب الفبا.
          # ⚠ پرچم -I (QUOTED_IDENTIFIER ON) لازم است — ایندکس‌های فیلترشده
          #    بدون آن ساخته نمی‌شوند (خطای 1934).
          for f in Tarazin.Data/Scripts/central/_Ensure.sql \
                   Tarazin.Data/Scripts/{accounting,assets,bi,branch,currency,goldshop,inventory,payroll,printing,store,treasury}/_Ensure.sql; do
            echo "── init: $f"
            docker cp "$f" "$CID:/tmp/init.sql"
            docker exec "$CID" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SQL_PASSWORD" -C -I -b -d master -i /tmp/init.sql
          done
          echo "All schemas initialized"

      - name: Run DB-backed guards (print templates + close year + multi-invoice gate)
        if: steps.wait-sql.outputs.ready == 'true'
        env:
          TARAZIN_TEST_CONN: "Server=localhost;Database=TarazinMaster;User Id=sa;Password=Tarazin#CI2026!;TrustServerCertificate=True;Encrypt=False"
        run: |
          dotnet test Tarazin.Tests/Tarazin.Tests.csproj --nologo \
            --filter "FullyQualifiedName~PrintTemplate|FullyQualifiedName~AccountingCloseYearTests|FullyQualifiedName~MultiInvoiceGateTests"
