name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  build:
    name: Build (single Blazor Server project)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Hermes.slnx

      - name: Build
        run: dotnet build Hermes.slnx -c Release --no-restore

      - name: Cross-schema static analysis
        run: bash tools/cross-schema-scan.sh

  codeql:
    name: SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - uses: github/codeql-action/analyze@v3
