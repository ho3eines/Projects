name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  build-web:
    name: Build web host + shared core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Tarazin.Web/Tarazin.Web.csproj

      - name: Build
        run: dotnet build Tarazin.Web/Tarazin.Web.csproj -c Release --no-restore

      - name: Cross-schema static analysis
        run: bash tools/cross-schema-scan.sh

  build-maui:
    name: Build MAUI Blazor Hybrid (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build MAUI (Windows target)
        run: dotnet build Tarazin.Maui/Tarazin.Maui.csproj -c Release -f net8.0-windows10.0.19041.0

  codeql:
    name: SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - uses: github/codeql-action/analyze@v3
