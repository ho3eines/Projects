name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  build-and-test:
    name: Build, scan & contract tests
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Hermes!Master2026"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Hermes!Master2026' -C -Q 'SELECT 1' -b || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Hermes!Master2026' -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Hermes.slnx

      - name: Build
        run: dotnet build Hermes.slnx -c Release --no-restore

      - name: Cross-schema static analysis (AC #3)
        run: bash tools/cross-schema-scan.sh

      - name: Contract tests (AC #1, #4)
        env:
          HERMES_TEST_CONNECTION: "Server=localhost,1433;Database=HermesMaster;User Id=sa;Password=Hermes!Master2026;TrustServerCertificate=True;Encrypt=False"
          HERMES_REPO_ROOT: ${{ github.workspace }}
          HERMES_STRICT_E2E: "1"
        run: dotnet test tests/Hermes.ContractTests/Hermes.ContractTests.csproj -c Release --no-build

  codeql:
    name: SAST (AC #5)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - uses: github/codeql-action/analyze@v3
