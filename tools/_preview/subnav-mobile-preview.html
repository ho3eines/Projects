<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SubNav Mobile Preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" />
<style>
  :root {
    --mud-palette-surface: #ffffff;
    --mud-palette-primary: #3f51b5;
    --mud-palette-text-primary: #1e1e2e;
    --mud-palette-text-secondary: #64748b;
    --mud-palette-divider: #e2e8f0;
    --mud-palette-drawer-icon: #d4b06a;
    --tz-ink: #1e1e2e;
    --tz-accent: #c89b3c;
    font-family: Vazirmatn, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f1f5f9; padding: 1rem; }
  .phone {
    width: 390px;
    margin: 0 auto 1.5rem;
    background: #fff;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.15);
    border: 1px solid #e2e8f0;
  }
  .phone-header { background: #1e1e2e; color: #fff; padding: .55rem .8rem; font-size: .8rem; opacity: .9; }
  .label { font-size: .78rem; color: #475569; margin: 0 0 .35rem .25rem; }
</style>
<link rel="stylesheet" href="../../Tarazin.Ui/wwwroot/css/app.css" />
<style>
  /* simulate MudBlazor icon class used in the component */
  .mud-icon-root { font-size: .95rem; line-height: 1; display: inline-flex; }
</style>
</head>
<body>
  <div class="label">🔍 موبایل ۳۹۰px — نوار زیرمنو (طراحی جدید: تب‌های جمع‌وجور زیرخطی)</div>
  <div class="phone">
    <div class="phone-header">‏🏠 داشبورد انبار</div>
    <div class="tz-subnav" style="--tz-accent:#c89b3c">
      <div class="tz-subnav__brand" style="--tz-accent:#c89b3c">
        <span class="mud-icon-root">🏬</span><span>انبارداری</span>
      </div>
      <div class="tz-subnav__tabs">
        <span class="tz-subnav__indicator" aria-hidden="true" style="opacity:1; transform:translateX(0); width:56px"></span>
        <a class="tz-subnav__tab is-active" href="#">
          <span class="mud-icon-root">🏠</span><span>خانه</span>
        </a>
        <a class="tz-subnav__tab" href="#">
          <span class="mud-icon-root">🧾</span><span>فاکتور خرید</span>
        </a>
        <a class="tz-subnav__tab" href="#">
          <span class="mud-icon-root">💵</span><span>فاکتور فروش</span>
        </a>
        <a class="tz-subnav__tab" href="#">
          <span class="mud-icon-root">🔄</span><span>انتقال</span>
        </a>
        <a class="tz-subnav__tab" href="#">
          <span class="mud-icon-root">📊</span><span>گزارشات</span>
        </a>
      </div>
    </div>
    <div style="padding:.9rem; color:#64748b; font-size:.82rem">محتوای صفحه… (نوار زیرمنو در حالت موبایل اسکرول افقی است)</div>
  </div>
</body>
</html>
