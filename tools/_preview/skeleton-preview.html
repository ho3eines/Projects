<!DOCTYPE html>

<meta charset="utf-8" />

<title>Skeleton Preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" />
<style>
  :root {
    --mud-palette-surface: #ffffff;
    --mud-palette-primary: #3f51b5;
    --mud-palette-text-primary: #1e1e2e;
    --mud-palette-text-secondary: #64748b;
    --mud-palette-divider: #e2e8f0;
    --tz-ink: #1e1e2e;
    --tz-accent: #c89b3c;
    font-family: Vazirmatn, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef1f6; padding: 1.2rem; color: var(--mud-palette-text-primary); }

  /* ── MudSkeleton approximation (text/circular) ── */
  .mud-skeleton {
    background: rgba(100, 116, 139, 0.22);
    border-radius: 4px;
    display: block;
    animation: mud-skeleton-pulse 1.5s ease-in-out infinite;
  }
  .mud-skeleton-circular { border-radius: 50%; }
  @keyframes mud-skeleton-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  /* MudGrid approximation */
  .mud-grid { display: flex; flex-wrap: wrap; margin: 0 -12px; width: calc(100% + 24px); }
  .mud-item { padding: 0 12px; margin-bottom: 24px; }
  .md-3 { flex-basis: 25%; max-width: 25%; }
  .sm-6 { flex-basis: 50%; max-width: 50%; }
  @media (max-width: 600px) { .sm-6, .md-3 { flex-basis: 100%; max-width: 100%; } }

  .section-title { font-size: .85rem; font-weight: 700; color: #334155; margin: 1.4rem 0 .5rem; }
  .paper { background: var(--mud-palette-surface); border: 1px solid var(--mud-palette-divider); border-radius: 12px; padding: .9rem; }
</style>
<link rel="stylesheet" href="../../Tarazin.Ui/wwwroot/css/app.css" />
</head>
